repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^docs/   # docs/ holds deploy artifacts (hosted dashboard HTML, figures), not source

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies:
          - types-pyyaml
          - numpy>=1.24
          - typer>=0.12
          - huggingface_hub>=0.23   # match CI's mypy env (discover.py imports it)
        args: ["--config-file=pyproject.toml"]
        files: ^src/procgrep/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procgrep"
version = "0.1.3"
description = "Procedural fingerprinting of LLM coding-agent rollouts: canonical atoms, BPE procedures, Jensen-Shannon divergence."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Hamidah Oderinwale" },
]
keywords = [
    "llm",
    "coding-agents",
    "procedural-fingerprinting",
    "bpe",
    "jensen-shannon",
    "trace-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "altair>=5.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
reward = [
    "pyyaml>=6.0",
]
viz = [
    "umap-learn>=0.5.5",  # only needed for umap_project / the `umap` CLI
    "matplotlib>=3.8",  # only needed to regenerate the essay/cascade figures (scripts/fig_*.py)
    "ruptures>=1.1",  # only needed for the intent-cliff change-point probe (plateau/cliff_probe.py)
]
embed = [
    "sentence-transformers>=2.2",  # only needed for the default hf_embedder; any callable works
]
dev = [
    "umap-learn>=0.5.5",  # so the umap_project test runs in CI
    "datasets>=2.19",  # so the from_hf tests can patch datasets.load_dataset
    "ruff==0.15.17",  # pinned to match .pre-commit-config so local lint == CI lint
    "mypy==1.18.2",   # pinned likewise (avoid local/CI linter version skew)
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-pyyaml",
]

[project.scripts]
procgrep = "procgrep.cli:app"

[project.urls]
Repository = "https://github.com/hamidahoderinwale/procgrep"
Issues = "https://github.com/hamidahoderinwale/procgrep/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/procgrep"]

[tool.hatch.build.targets.sdist]
# Ship the library, its tests, runnable examples, and the markdown docs; keep
# the rendered essay/figures (docs/), case studies, data stores, and the HF
# Space app out of the source distribution (pyproject.toml is always included).
include = [
    "src/procgrep",
    "tests",
    "examples",
    "README.md",
    "NOTES.md",
    "FAQ.md",
    "METRICS.md",
    "STUDIES.md",
    "CITATION.cff",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = ["case-studies", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # allow assert False

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "umap.*",
    "altair.*",
    "sklearn.*",
    "scipy.*",
    "datasets.*",
    "typer.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:umap.*",
    "ignore::ImportWarning:umap.*",
    "ignore::UserWarning:umap.*",
    "ignore::DeprecationWarning:numba.*",
    "ignore::DeprecationWarning:sklearn.*",
    "ignore::FutureWarning:sklearn.*",
]

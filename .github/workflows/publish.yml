name: publish

# Publishes procgrep to PyPI on a GitHub Release, via PyPI Trusted Publishing
# (OIDC, no API token in secrets). One-time setup before this can run:
#   1. Create the project's trusted publisher on PyPI -> the project's
#      "Publishing" settings: owner=hamidahoderinwale, repo=procgrep,
#      workflow=publish.yml, environment=pypi.
#   2. Bump `version` in pyproject.toml, then publish a GitHub Release.
# Until step 1 is done the upload step is a no-op-by-rejection, so merging this
# file does not publish anything.

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: build sdist + wheel and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

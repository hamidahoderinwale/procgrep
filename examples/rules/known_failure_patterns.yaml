# Example procedural checks for coding-agent traces.
# These heuristics flag action sequences, not task outcomes or reward hacking.
# Thresholds are configurable examples; validate them on your own labeled traces.
# Evaluate complete traces: tests and submission may be absent in a live prefix.
#
# Usage:
#   patterns = load_patterns("examples/rules/known_failure_patterns.yaml")
#   report = match_patterns(traces, patterns)
#
# Regexes match space-separated atom names with a trailing space.
# must_hold: true requires a match; false flags a match as a violation.

rules:
  - name: localize_before_edit
    description: A localize, search_repo, or read_file must precede the first edit.
    pattern: '^(?:(?!edit )[^ ]+ )*(?:localize|search_repo|read_file) (?:[^ ]+ )*edit '
    must_hold: true

  - name: tests_run_at_least_once
    description: The trajectory must contain at least one run_test atom.
    pattern: '(?:^| )run_test '
    must_hold: true

  - name: test_before_submit
    description: A run_test must precede the first submit.
    pattern: '^(?:(?!submit )[^ ]+ )*run_test (?:[^ ]+ )*submit '
    must_hold: true

  - name: stuck_edit_loop
    description: Flag five or more consecutive edits without any other action.
    pattern: '(?:^| )(?:edit ){5,}'
    must_hold: false

  - name: read_thrashing
    description: Flag ten or more consecutive reads without any other action.
    pattern: '(?:^| )(?:read_file ){10,}'
    must_hold: false

  - name: ends_in_submit
    description: The final atom must be submit.
    pattern: '(?:^| )submit $'
    must_hold: true

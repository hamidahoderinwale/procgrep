[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procgrep-runner"
version = "0.1.0"
description = "Execute agents under a procgrep ProcedureSpec in sandboxes and feed the traces back to verify"
requires-python = ">=3.10"
dependencies = [
    "mini-swe-agent>=2.4",
    "procgrep",
    "pyyaml>=6",
    "typer>=0.9",
]

[project.optional-dependencies]
swebench = ["datasets>=2.14"]
# swe-rex backs the swerex_modal environment class; 1.4.0 needs the
# encrypted-tunnel patch (scripts/patch_swerex.py) after every reinstall.
modal = ["mini-swe-agent[modal]>=2.4", "swe-rex>=1.4"]

[project.scripts]
procgrep-runner = "procgrep_runner.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
procgrep = { path = "..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/procgrep_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
